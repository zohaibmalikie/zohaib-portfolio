name: Live Lighthouse audit

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  audit:
    name: Lighthouse (${{ matrix.profile }})
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        profile: [mobile, desktop]
    env:
      SITE_URL: https://www.zohaibramzan.com/
      AUDIT_PROFILE: ${{ matrix.profile }}
    steps:
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Record runner egress country
        continue-on-error: true
        shell: bash
        run: |
          node --input-type=module <<'JS'
          const response = await fetch('https://www.cloudflare.com/cdn-cgi/trace', { signal: AbortSignal.timeout(10000) });
          if (!response.ok) throw new Error('Egress lookup unavailable');
          console.log((await response.text()).split('\n').filter(line => /^(loc|colo)=/.test(line)).join('\n'));
          JS

      - name: Audit the public site
        shell: bash
        run: |
          mkdir -p reports
          export CHROME_PATH="$(command -v google-chrome)"
          profile_args=()
          if [[ "$AUDIT_PROFILE" == "desktop" ]]; then
            profile_args+=(--preset=desktop)
          fi
          npx --yes lighthouse@13.5.0 "$SITE_URL" "${profile_args[@]}" \
            --quiet --chrome-flags="--headless --no-sandbox" \
            --output=json --output=html --output-path="reports/$AUDIT_PROFILE"

      - name: Summarize measured scores
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const profile = process.env.AUDIT_PROFILE;
          const report = JSON.parse(fs.readFileSync('reports/' + profile + '.report.json', 'utf8'));
          if (report.runtimeError) throw new Error(report.runtimeError.message);
          const rows = Object.values(report.categories).map(category => '| ' + category.title + ' | ' + Math.round(category.score * 100) + ' |');
          const summary = '## ' + profile + ' — live Lighthouse\n\n' +
            'Target: ' + report.finalDisplayedUrl + '\n\n' +
            '| Category | Score |\n| --- | ---: |\n' + rows.join('\n') +
            '\n\nA successful job means the audit completed; it does not mean every category scored 100. These are lab measurements, not guaranteed field performance or Google PageSpeed results.\n';
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
          console.log(summary);
          JS

      - name: Save public-page reports
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: lighthouse-${{ matrix.profile }}
          path: reports/
          retention-days: 7
          if-no-files-found: warn
